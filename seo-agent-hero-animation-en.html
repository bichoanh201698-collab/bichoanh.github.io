 255);\n  --color-black: rgb(0, 0, 0);\n\n  /* Neutral / Gray scale */\n  --color-gray-50:  rgb(250, 250, 250);\n  --color-gray-75:  rgb(247, 247, 247);\n  --color-gray-100: rgb(241, 241, 241);\n  --color-gray-150: rgb(240, 240, 242);\n  --color-gray-200: rgb(235, 235, 235);\n  --color-gray-300: rgb(227, 227, 227);\n  --color-gray-400: rgb(204, 204, 204);\n  --color-gray-500: rgb(181, 181, 181);\n  --color-gray-600: rgb(138, 138, 138);\n  --color-gray-700: rgb(97, 97, 97);\n  --color-gray-800: rgb(66, 66, 77);\n  --color-gray-900: rgb(48, 48, 48);\n  --color-gray-950: rgb(26, 26, 26);\n  --color-gray-1000: rgb(12, 12, 16);\n  --color-ink: rgb(44, 44, 52);  /* primary button \"ink\" black */\n\n  /* Brand / Accent (Shopify) */\n  --color-brand-50:  rgb(228, 247, 235);\n  --color-brand-100: rgb(208, 240, 222);\n  --color-brand-500: rgb(0, 122, 92);\n  --color-brand-600: rgb(0, 102, 80);\n  --color-brand-700: rgb(15, 81, 50);\n\n  /* Status */\n  --color-info-50:   rgb(234, 244, 255);\n  --color-info-500:  rgb(0, 91, 211);\n  --color-info-700:  rgb(0, 64, 155);\n\n  --color-success-50:  rgb(228, 251, 238);\n  --color-success-500: rgb(22, 151, 91);\n  --color-success-700: rgb(15, 81, 50);\n\n  --color-warning-50:  rgb(255, 244, 217);\n  --color-warning-500: rgb(180, 124, 0);\n  --color-warning-700: rgb(122, 86, 0);\n\n  --color-critical-50:  rgb(254, 233, 232);\n  --color-critical-500: rgb(199, 41, 30);\n  --color-critical-700: rgb(142, 31, 11);\n\n  --color-magic-50:  rgb(244, 230, 254);\n  --color-magic-500: rgb(127, 73, 195);\n  --color-magic-700: rgb(80, 36, 143);\n\n  /* SocialWidget brand — minimal differentiator inside Polaris.\n     Pulled from the SocialWidget app icon palette: a warm coral\n     accent used only in the marketing surface and onboarding hero.\n     Inside the admin app itself we defer to Polaris. */\n  --color-sw-coral: rgb(255, 104, 88);\n  --color-sw-coral-soft: rgb(255, 232, 228);\n\n  /* Primary graphic color — used for illustrations, empty-state imagery,\n     hero spots. Distinct from --color-ink, which is the primary UX\n     (button) color. */\n  --color-graphic-primary:      rgb(91, 134, 229);   /* #5B86E5 */\n  --color-graphic-primary-soft: rgb(225, 234, 251);\n\n  /* ── Polaris semantic tokens (the ones to reach for) ──────────── */\n  /* Surface / background */\n  --p-color-bg-surface:                 var(--color-white);\n  --p-color-bg-surface-secondary:       var(--color-gray-75);\n  --p-color-bg-surface-tertiary:        var(--color-gray-100);\n  --p-color-bg-surface-hover:           var(--color-gray-100);\n  --p-color-bg-surface-active:          var(--color-gray-150);\n  --p-color-bg-surface-selected:        var(--color-gray-150);\n  --p-color-bg-app:                     var(--color-gray-100);\n  --p-color-bg-inverse:                 var(--color-gray-950);\n  --p-color-bg-fill-brand:              var(--color-ink);\n  --p-color-bg-fill-success:            var(--color-success-500);\n  --p-color-bg-fill-success-secondary:  var(--color-success-50);\n  --p-color-bg-fill-warning-secondary:  var(--color-warning-50);\n  --p-color-bg-fill-critical:           var(--color-critical-500);\n  --p-color-bg-fill-critical-secondary: var(--color-critical-50);\n  --p-color-bg-fill-info-secondary:     var(--color-info-50);\n  --p-color-bg-fill-magic-secondary:    var(--color-magic-50);\n\n  /* Border */\n  --p-color-border:                     var(--color-gray-300);\n  --p-color-border-secondary:           var(--color-gray-200);\n  --p-color-border-hover:               var(--color-gray-500);\n  --p-color-border-focus:               var(--color-info-500);\n  --p-color-border-critical:            var(--color-critical-500);\n  --p-color-border-input:               var(--color-gray-600);\n  --p-color-border-input-hover:         var(--color-gray-700);\n\n  /* Text */\n  --p-color-text:                       var(--color-gray-900);\n  --p-color-text-secondary:             var(--color-gray-700);\n  --p-color-text-disabled:              var(--color-gray-500);\n  --p-color-text-inverse:               var(--color-white);\n  --p-color-text-brand:                 var(--color-info-500);\n  --p-color-text-link:                  var(--color-info-500);\n  --p-color-text-link-hover:            var(--color-info-700);\n  --p-color-text-success:               var(--color-success-700);\n  --p-color-text-warning:               var(--color-warning-700);\n  --p-color-text-critical:              var(--color-critical-700);\n  --p-color-text-magic:                 var(--color-magic-700);\n\n  /* Icon */\n  --p-color-icon:                       var(--color-gray-900);\n  --p-color-icon-secondary:             var(--color-gray-700);\n  --p-color-icon-disabled:              var(--color-gray-500);\n  --p-color-icon-inverse:               var(--color-white);\n  --p-color-icon-brand:                 var(--color-ink);\n  --p-color-icon-success:               var(--color-success-500);\n  --p-color-icon-warning:               var(--color-warning-500);\n  --p-color-icon-critical:              var(--color-critical-500);\n\n  /* ── Typography ───────────────────────────────────────────────── */\n  --font-sans: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\",\n               \"Helvetica Neue\", Arial, sans-serif;\n  --font-mono: \"SF Mono\", ui-monospace, \"JetBrains Mono\", Menlo,\n               Consolas, monospace;\n\n  /* Polaris type scale (semantic) */\n  --p-text-heading-3xl:  600 30px/36px var(--font-sans);\n  --p-text-heading-2xl:  600 24px/28px var(--font-sans);\n  --p-text-heading-xl:   600 20px/24px var(--font-sans);\n  --p-text-heading-lg:   600 16px/20px var(--font-sans);\n  --p-text-heading-md:   600 14px/20px var(--font-sans);\n  --p-text-heading-sm:   600 12px/16px var(--font-sans);\n\n  --p-text-body-lg:      500 14px/20px var(--font-sans);\n  --p-text-body-md:      500 13px/20px var(--font-sans);\n  --p-text-body-sm:      500 12px/16px var(--font-sans);\n\n  --p-text-caption:      500 12px/16px var(--font-sans);\n  --p-text-code:         500 12px/16px var(--font-mono);\n\n  /* Letter spacing */\n  --p-tracking-tight:    -0.3px;\n  --p-tracking-base:     -0.2px;\n\n  /* ── Spacing (4-base) ─────────────────────────────────────────── */\n  --p-space-050: 2px;\n  --p-space-100: 4px;\n  --p-space-150: 6px;\n  --p-space-200: 8px;\n  --p-space-300: 12px;\n  --p-space-400: 16px;\n  --p-space-500: 20px;\n  --p-space-600: 24px;\n  --p-space-800: 32px;\n  --p-space-1000: 40px;\n  --p-space-1200: 48px;\n  --p-space-1600: 64px;\n\n  /* ── Radius ───────────────────────────────────────────────────── */\n  --p-border-radius-50:  2px;\n  --p-border-radius-100: 4px;\n  --p-border-radius-150: 6px;\n  --p-border-radius-200: 8px;\n  --p-border-radius-300: 12px;\n  --p-border-radius-400: 16px;\n  --p-border-radius-full: 9999px;\n\n  /* ── Elevation / shadow (Polaris's distinctive layered look) ──── */\n  /* The card \"lift\": 1px ambient drop + inner highlight + inner edges */\n  --p-shadow-card:\n    0 1px 0 0 rgba(26, 26, 26, 0.07),\n    inset 0 1px 0 0 rgba(204, 204, 204, 0.5),\n    inset 0 -1px 0 0 rgba(0, 0, 0, 0.17),\n    inset -1px 0 0 0 rgba(0, 0, 0, 0.13),\n    inset 1px 0 0 0 rgba(0, 0, 0, 0.13);\n\n  /* Popovers / menus float a bit higher */\n  --p-shadow-popover:\n    0 12px 20px -8px rgba(26, 26, 26, 0.24),\n    inset 0 1px 0 0 rgba(204, 204, 204, 0.5),\n    inset 0 -1px 0 0 rgba(0, 0, 0, 0.17),\n    inset -1px 0 0 0 rgba(0, 0, 0, 0.13),\n    inset 1px 0 0 0 rgba(0, 0, 0, 0.13);\n\n  /* Modal */\n  --p-shadow-modal:\n    0 26px 80px rgba(0, 0, 0, 0.20),\n    0 0 1px rgba(0, 0, 0, 0.40);\n\n  /* Button — primary uses the inset highlight + 1px shadow trick */\n  --p-shadow-button:\n    inset 0 -1px 0 0 rgba(0, 0, 0, 0.20),\n    inset 0 1px 0 0 rgba(255, 255, 255, 0.20),\n    0 1px 0 0 rgba(0, 0, 0, 0.05);\n  --p-shadow-button-secondary:\n    0 -1px 0 0 rgba(181, 181, 181, 0.4) inset,\n    0 0 0 1px rgba(0, 0, 0, 0.10) inset,\n    0 1px 0 0 rgba(0, 0, 0, 0.05);\n\n  /* Focus ring — Polaris 2px white halo + 2px blue ring */\n  --p-focus-ring: 0 0 0 2px var(--color-white), 0 0 0 4px var(--color-info-500);\n}\n\n/* ── Element defaults ───────────────────────────────────────────── */\nhtml, body {\n  font: var(--p-text-body-md);\n  color: var(--p-color-text);\n  background: var(--p-color-bg-app);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1 { font: var(--p-text-heading-3xl); letter-spacing: var(--p-tracking-tight); margin: 0; }\nh2 { font: var(--p-text-heading-2xl); letter-spacing: var(--p-tracking-base); margin: 0; }\nh3 { font: var(--p-text-heading-xl);  letter-spacing: var(--p-tracking-base); margin: 0; }\nh4 { font: var(--p-text-heading-lg);  margin: 0; }\nh5 { font: var(--p-text-heading-md);  margin: 0; }\nh6 { font: var(--p-text-heading-sm);  margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }\n\np  { font: var(--p-text-body-md); color: var(--p-color-text); margin: 0; }\nsmall { font: var(--p-text-body-sm); color: var(--p-color-text-secondary); }\ncode { font: var(--p-text-code); background: var(--color-gray-100); padding: 1px 4px; border-radius: 4px; }\n\na {\n  color: var(--p-color-text-link);\n  text-decoration: none;\n}\na:hover { color: var(--p-color-text-link-hover); text-decoration: underline; }\n</style>\n  <script>window.OM_SCENES = '[{\"name\":\"Nhập website\",\"dur\":1.25,\"desc\":\"Merchant dán link website vào ô nhập, ô nhập thu lại thành một nút tròn\"},{\"name\":\"AI phân tích\",\"dur\":2.5,\"desc\":\"Bốn dòng trạng thái lần lượt chạy xong: hiểu khách hàng, giọng thương hiệu, chủ đề, ý tưởng\"},{\"name\":\"Chủ đề\",\"dur\":1.25,\"desc\":\"Bốn nhánh chủ đề nội dung toả ra từ website\"},{\"name\":\"Ý tưởng\",\"dur\":1.5,\"desc\":\"Camera zoom vào một chủ đề, các ý tưởng bài viết con toả ra\"},{\"name\":\"Tinh chỉnh\",\"dur\":2.25,\"desc\":\"Merchant sửa lại yêu cầu, gõ một câu cụ thể hơn\"},{\"name\":\"Tìm từ khóa\",\"dur\":0.75,\"desc\":\"Vòng xoa
