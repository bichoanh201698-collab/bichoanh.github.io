<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ClawExperts, expert-built AI agents for real business workflows.">
  <title>ClawExperts | Show, Don't Tell Prototype</title>
  <style>
    :root {
      --ink: #1c1c1e;
      --muted: #6b6469;
      --paper: #fff9f8;
      --card: #ffffff;
      --line: #e5dfdd;
      --red: #ef3f35;
      --green: #3da268;
      --peach: #ffdfcb;
      --blue: #dbe2ff;
      --shadow: 0 14px 40px rgba(41, 31, 35, .08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      letter-spacing: -.02em;
    }
    body.menu-open { overflow: hidden; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .container { width: min(1316px, calc(100% - 48px)); margin-inline: auto; }
    .eyebrow { margin: 0 0 22px; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .02em; }
    .section-title { margin: 0; font-size: clamp(36px, 4vw, 58px); line-height: .98; letter-spacing: -.055em; }
    .section-copy { margin: 22px 0 0; color: var(--muted); font-size: 16px; line-height: 1.55; }
    .btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 24px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(28,28,30,.16); }
    .btn.light { background: #fff; color: var(--ink); }
    .btn.small { min-height: 40px; padding: 0 20px; font-size: 12px; }
    .arrow-dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--ink); }

    /* Navigation pill */
    .nav-wrap { position: fixed; z-index: 1000; inset: 20px 0 auto; pointer-events: none; }
    .nav-pill {
      position: relative;
      width: min(980px, calc(100% - 32px));
      min-height: 64px;
      margin: auto;
      padding: 10px 14px 10px 18px;
      border: 1px solid rgba(255,255,255,.68);
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.34) 46%, rgba(244,238,237,.42));
      box-shadow: 0 18px 48px rgba(34,26,28,.13), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(26px) saturate(1.45);
      -webkit-backdrop-filter: blur(26px) saturate(1.45);
      display: flex;
      align-items: center;
      pointer-events: auto;
    }
    .nav-pill::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(115deg, rgba(255,255,255,.7), rgba(255,255,255,0) 38%, rgba(255,255,255,.38) 72%, rgba(255,255,255,0));
      opacity: .75;
      pointer-events: none;
    }
    .brand { min-width: 188px; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; white-space: nowrap; }
    .brand img { width: 21px; height: 27px; object-fit: contain; }
    .nav-links { flex: 1; margin-left: 0; display: flex; justify-content: center; align-items: center; gap: 2px; }
    .nav-link {
      position: relative;
      height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 13px;
      padding: 0 14px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .nav-link:hover, .nav-link:focus-visible { background: rgba(255,255,255,.72); color: var(--ink); outline: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.85); }
    .nav-link.active { color: var(--ink); font-weight: 750; }
    .nav-link img { width: 13px; height: 13px; transition: transform .2s ease; }
    .resources.open .nav-link img { transform: rotate(180deg); }
    .nav-cta { width: 188px; margin-left: 0; min-height: 40px; border-radius: 10px; padding-inline: 22px; justify-content: center; }
    .language-toggle { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 2px; height: 34px; margin-left: 12px; margin-right: 8px; padding: 3px; border: 1px solid rgba(34,30,30,.12); border-radius: 10px; background: rgba(255,255,255,.46); color: var(--muted); font: inherit; font-size: 11px; font-weight: 850; letter-spacing: .04em; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.75); }
    .language-toggle span { display: grid; min-width: 27px; height: 26px; place-items: center; border-radius: 7px; transition: background .2s ease, color .2s ease, box-shadow .2s ease; }
    .language-toggle .active { background: var(--ink); color: #fff; box-shadow: 0 3px 8px rgba(28,28,30,.18); }
    .language-toggle:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
    .resources { position: relative; }
    .resource-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 140px;
      padding: 7px;
      border: 1px solid #d7d3d2;
      border-radius: 15px;
      background: rgba(255,255,255,.74);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px) saturate(1.35);
      -webkit-backdrop-filter: blur(18px) saturate(1.35);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: .2s ease;
    }
    .resources.open .resource-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    .resource-menu a { display: block; padding: 9px 12px; border-radius: 10px; color: var(--muted); font-size: 14px; }
    .resource-menu a:hover, .resource-menu a:focus-visible { background: #fff; color: var(--ink); font-weight: 700; outline: none; }
    .menu-toggle { display: none; margin-left: auto; width: 42px; height: 42px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font-size: 21px; cursor: pointer; }

    /* Hero */
    .hero { padding: 148px 0 62px; text-align: center; }
    .hero .kicker { margin: 0 0 24px; font-size: 14px; font-weight: 800; }
    .hero h1 { max-width: 940px; margin: auto; font-size: clamp(55px, 6.1vw, 88px); line-height: .94; letter-spacing: -.065em; text-wrap: balance; }
    .hero h1 span { color: var(--red); }
    html[lang="vi"] .hero h1 { max-width: 1160px; font-size: clamp(55px, 5.7vw, 82px); }
    .hero-copy { max-width: 760px; margin: 25px auto 0; color: var(--muted); font-size: 16px; }
    .hero-actions { display: flex; justify-content: center; gap: 12px; margin-top: 62px; }
    .benefits { margin: 50px auto 0; display: flex; justify-content: center; gap: 52px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .benefits span { display: flex; align-items: center; gap: 10px; }
    .benefits i { width: 13px; height: 13px; border-radius: 50%; background: var(--ink); position: relative; }
    .benefits i::after { content: ""; width: 3px; height: 3px; border-radius: 50%; background: white; position: absolute; inset: 5px; }
    .hero-visual { margin-top: 92px; padding: 13px; border: 1px solid #d7d2d0; border-radius: 26px; background: #dedcdb; box-shadow: var(--shadow); }
    .hero-visual img { width: 100%; border-radius: 19px; }

    .logos { padding: 19px 0 22px; border-block: 1px solid #eee7e5; }
    .logos-inner { display: flex; align-items: center; justify-content: center; gap: 92px; color: var(--muted); font-size: 14px; }
    .logos-list { display: flex; align-items: center; gap: 26px; }
    .logos-list img { height: 24px; width: auto; max-width: 130px; object-fit: contain; }
    .logos-list .divider { width: 1px; height: 24px; background: #d9d2d0; }

    /* Agent showcase */
    .showcase { position: relative; padding: 120px 0 70px; overflow: hidden; }
    .showcase-grid { display: grid; grid-template-columns: 360px 1fr; gap: 0; align-items: start; }
    .agent-tabs { padding: 18px 40px 0 0; }
    .agent-tab { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 24px 0; background: transparent; text-align: left; cursor: pointer; }
    .agent-tab strong { display: block; font-size: 17px; }
    .agent-tab .tab-details { max-height: 0; overflow: hidden; opacity: 0; transition: .32s ease; }
    .agent-tab.active .tab-details { max-height: 520px; opacity: 1; }
    .agent-tab p { margin: 14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .social-orb { position: absolute; z-index: -1; width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 12px 25px rgba(0,0,0,.1)); }
    .social-orb.fb { right: 95px; top: 42px; transform: rotate(12deg); }
    .social-orb.zalo { left: calc(50% - 380px); bottom: 220px; transform: rotate(-10deg); }
    .dashboard-frame { padding: 12px; border: 1px solid #d4cfcd; border-radius: 22px; background: #dfdddc; box-shadow: var(--shadow); min-height: 360px; display: grid; place-items: center; }
    .dashboard-frame img { width: 100%; border-radius: 15px; transition: opacity .2s ease; }
    .showcase-cta { text-align: center; margin-top: 72px; }
    .showcase-cta .btn { min-width: 220px; }
    .fineprint { margin: 12px 0 0; color: var(--muted); font-size: 12px; }

    /* How it works and catalog */
    .how { padding: 80px 0; }
    .how-top { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; padding-bottom: 62px; border-bottom: 1px solid var(--line); }
    .steps { display: grid; gap: 0; }
    .step { display: grid; grid-template-columns: 45px 1fr; gap: 20px; padding: 25px 0; border-bottom: 1px solid var(--line); }
    .step:last-child { border-bottom: 0; }
    .step-num { font-size: 17px; font-weight: 800; }
    .step h3 { margin: 0; font-size: 17px; }
    .step p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .catalog-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin: 44px 0 28px; }
    .catalog-head h3 { margin: 0; font-size: 18px; }
    .catalog-head p { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .text-link { color: var(--red); font-size: 14px; font-weight: 700; }
    .agent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .agent-card { min-height: 242px; padding: 16px; border-radius: 24px; background: #ccd4f2; }
    .agent-card:nth-child(2) { background: #aee0db; }
    .agent-card:nth-child(3) { background: #fff; border: 1px solid var(--line); }
    .agent-card:nth-child(4) { background: transparent; border: 1px dashed #7e7577; }
    .agent-card-inner { height: 100%; padding: 28px; border: 1px solid rgba(255,255,255,.85); border-radius: 17px; background: rgba(255,255,255,.8); }
    .agent-card:nth-child(3) .agent-card-inner, .agent-card:nth-child(4) .agent-card-inner { border: 0; background: transparent; }
    .agent-card-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .agent-card h4 { margin: 0; font-size: 18px; }
    .badge { border-radius: 999px; padding: 8px 14px; background: var(--green); color: white; font-size: 11px; font-weight: 700; }
    .badge.soon { background: #f3eeee; color: var(--muted); }
    .agent-card p { max-width: 620px; margin: 28px 0 22px; color: var(--muted); font-size: 14px; }

    /* Shift: self-completing workflow */
    .shift { padding: 112px 0 92px; }
    .shift-head { text-align: center; }
    .shift-head .section-title { max-width: 760px; margin: auto; }
    .shift-head .section-copy { max-width: 700px; margin-inline: auto; }
    .autopilot-stage {
      position: relative;
      width: min(1430px, calc(100vw - 48px));
      min-height: 680px;
      margin: 52px 0 0 50%;
      padding: 28px 28px 34px;
      overflow: hidden;
      border: 1px solid #e0d9d6;
      border-radius: 26px;
      background: rgba(255,255,255,.3);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
      transform: translateX(-50%);
    }
    .autopilot-stage::after {
      content: "";
      position: absolute;
      z-index: 0;
      left: 50%;
      bottom: -180px;
      width: 620px;
      height: 280px;
      border-radius: 50%;
      background: rgba(255, 202, 169, .34);
      filter: blur(70px);
      transform: translateX(-50%) scale(.55);
      opacity: 0;
      transition: opacity .7s ease, transform 1.1s cubic-bezier(.16,1,.3,1);
      pointer-events: none;
    }
    .autopilot-stage.is-ready::after { opacity: 1; transform: translateX(-50%) scale(1); }
    .autopilot-stage.is-resetting::after { opacity: 0; transition: none; }
    .workflow-movie { position: relative; z-index: 1; width: min(680px, 100%); margin: 0 auto; }
    .goal-strip {
      display: grid;
      grid-template-columns: 52px minmax(0,1fr) auto;
      align-items: center;
      gap: 16px;
      min-height: 76px;
      padding: 12px 18px 12px 12px;
      border: 1px solid #ebe5e2;
      border-radius: 15px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 11px 25px rgba(37,28,31,.07);
      opacity: 0;
      transform: translateY(-12px) scale(.985);
      transition: opacity .55s ease, transform .7s cubic-bezier(.16,1,.3,1);
    }
    .autopilot-stage.is-playing .goal-strip { opacity: 1; transform: none; }
    .goal-mark, .result-mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 13px;
      background: #fff0e8;
    }
    .goal-mark input, .result-mark input, .task-check {
      margin: 0;
      accent-color: var(--red);
      pointer-events: none;
    }
    .goal-mark input { width: 22px; height: 22px; }
    .goal-strip strong { font-size: 16px; line-height: 1.3; }
    .goal-strip small { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .task-stack {
      margin: 14px auto 0;
      overflow: hidden;
      border: 1px solid #e1e4e6;
      border-radius: 16px;
      background: rgba(250,251,252,.94);
      box-shadow: 0 12px 34px rgba(35,27,30,.035);
    }
    .task-row {
      position: relative;
      display: grid;
      grid-template-columns: 28px minmax(0,1fr) auto;
      align-items: center;
      gap: 16px;
      min-height: 74px;
      padding: 14px 20px;
      border-bottom: 1px solid #e4e7e9;
      color: #828389;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .45s ease, transform .55s cubic-bezier(.16,1,.3,1), color .35s ease, background .35s ease;
    }
    .task-row:last-child { border-bottom: 0; }
    .autopilot-stage.is-playing .task-row { opacity: 1; transform: none; }
    .autopilot-stage.is-playing .task-row:nth-child(1) { transition-delay: .18s; }
    .autopilot-stage.is-playing .task-row:nth-child(2) { transition-delay: .26s; }
    .autopilot-stage.is-playing .task-row:nth-child(3) { transition-delay: .34s; }
    .autopilot-stage.is-playing .task-row:nth-child(4) { transition-delay: .42s; }
    .task-row.is-active { color: var(--ink); background: #fff; }
    .task-row.is-complete { color: var(--ink); }
    .task-check { width: 22px; height: 22px; accent-color: var(--ink); }
    .task-copy { min-width: 0; }
    .task-copy strong { display: block; font-size: 14px; line-height: 1.25; }
    .task-copy small { display: block; height: 18px; margin-top: 3px; color: var(--muted); font-size: 12px; opacity: 0; transform: translateY(-4px); transition: .3s ease; }
    .task-row.is-active .task-copy small { opacity: 1; transform: none; }
    .task-state { color: #8a8b91; font-size: 12px; white-space: nowrap; }
    .task-row.is-active .task-state { color: var(--red); }
    .task-progress {
      position: absolute;
      left: 64px;
      right: 20px;
      bottom: 7px;
      height: 2px;
      overflow: hidden;
      border-radius: 999px;
      background: #f1e5df;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .task-progress span { display: block; width: 0; height: 100%; background: var(--red); }
    .task-row.is-active .task-progress { opacity: 1; }
    .task-row.is-active .task-progress span { animation: taskSweep 1.1s cubic-bezier(.4,0,.2,1) forwards; }
    .no-input-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 18px 0 16px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      opacity: 0;
      transform: translateY(-5px);
      transition: .45s ease;
    }
    .autopilot-stage.is-playing .no-input-note { opacity: 1; transform: none; transition-delay: .55s; }
    .no-input-note input { width: 16px; height: 16px; margin: 0; accent-color: var(--red); pointer-events: none; }
    .result-tray {
      display: grid;
      grid-template-columns: 62px minmax(0,1fr) auto;
      align-items: center;
      gap: 18px;
      width: calc(100% + 100px);
      min-height: 128px;
      margin-left: -50px;
      padding: 22px 26px;
      border: 1px solid #f0cdb8;
      border-radius: 22px;
      background: rgba(255,255,255,.95);
      box-shadow: 0 22px 48px rgba(214,103,45,.12);
      opacity: 0;
      transform: translateY(26px) scale(.97);
      transition: opacity .6s ease, transform .85s cubic-bezier(.16,1,.3,1), box-shadow .8s ease;
      pointer-events: none;
    }
    .autopilot-stage.is-ready .result-tray { opacity: 1; transform: none; pointer-events: auto; box-shadow: 0 24px 54px rgba(214,103,45,.19); }
    .autopilot-stage.is-resetting .result-tray { opacity: 0; transform: translateY(26px) scale(.97); transition: none; }
    .result-mark { width: 62px; height: 62px; border-radius: 16px; }
    .result-mark input { width: 30px; height: 30px; }
    .result-copy strong { display: block; font-size: 22px; line-height: 1.1; letter-spacing: -.035em; }
    .result-copy small { display: block; margin-top: 7px; color: var(--muted); font-size: 14px; }
    .result-tray .btn { min-width: 136px; }
    @keyframes taskSweep { from { width: 0; } to { width: 100%; } }
    .capabilities-title { margin: 58px 0 30px; text-align: center; font-size: 26px; line-height: 1.12; letter-spacing: -.04em; }
    .legacy-capabilities { display: none; }
    .capabilities-bento {
      display: grid;
      grid-template-columns: .95fr 1fr 1fr;
      grid-template-rows: repeat(2, minmax(280px, auto));
      gap: 16px;
    }
    .bento-capability {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid #e5dfdd;
      border-radius: 24px;
      background: rgba(247, 243, 242, .86);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.92);
    }
    .bento-capability:not(.bento-tools) {
      display: grid;
      grid-template-rows: minmax(162px, 1fr) auto;
      padding: 20px 26px 24px;
    }
    .bento-capability h4 { margin: 0; font-size: 19px; line-height: 1.12; letter-spacing: -.035em; }
    .bento-capability p { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.42; letter-spacing: -.015em; }
    .bento-visual { position: relative; min-height: 0; }

    .bento-tools {
      grid-row: 1 / span 2;
      padding: 44px 30px 34px;
      background: #202022;
      border-color: #202022;
      color: #fff;
      box-shadow: 0 18px 42px rgba(28,28,30,.11), inset 0 1px 0 rgba(255,255,255,.08);
    }
    .tool-flow { position: relative; display: grid; gap: 12px; padding: 0 0 0 36px; }
    .tool-flow::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 22px;
      bottom: 22px;
      width: 2px;
      border-radius: 99px;
      background: #4a4545;
    }
    .tool-flow::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 22px;
      width: 2px;
      height: calc(100% - 44px);
      border-radius: 99px;
      background: var(--red);
      box-shadow: 0 0 16px rgba(239,63,53,.65);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform 2.55s cubic-bezier(.35,0,.2,1);
    }
    .capabilities-bento.is-active .tool-flow::after { transform: scaleY(1); }
    .tool-row {
      position: relative;
      min-height: 68px;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 0 17px;
      border: 1px solid #3c393a;
      border-radius: 14px;
      background: #29292b;
      color: #bcb7b8;
      box-shadow: 0 9px 22px rgba(0,0,0,.14);
      transition: color .24s ease, border-color .24s ease, transform .28s cubic-bezier(.16,1,.3,1), background .24s ease;
    }
    .tool-row::before {
      content: "";
      position: absolute;
      left: -36px;
      top: 50%;
      width: 14px;
      height: 14px;
      border: 2px solid #797173;
      border-radius: 50%;
      background: #202022;
      transform: translateY(-50%);
      transition: border-color .22s ease, box-shadow .22s ease, background .22s ease;
    }
    .tool-row strong { font-size: 14px; font-weight: 650; }
    .tool-row input { width: 18px; height: 18px; margin: 0; accent-color: var(--red); pointer-events: none; }
    .tool-row.is-current { color: #fff; border-color: #5a4a4a; background: #313033; }
    .tool-row.is-current::before, .tool-row.is-done::before { border-color: #ff786f; background: var(--red); box-shadow: 0 0 14px rgba(239,63,53,.7); }
    .tool-row.is-done { color: #f6f3f3; }
    .bento-tools .bento-copy { position: absolute; left: 36px; right: 36px; bottom: 34px; }
    .bento-tools h4 { font-size: 26px; }
    .bento-tools p { color: #c8c1c3; font-size: 15px; }

    .request-stack { height: 100%; display: grid; place-items: center; padding-top: 4px; }
    .request-sheet {
      position: absolute;
      width: min(235px, 74%);
      min-height: 62px;
      padding: 14px 18px;
      border: 1px solid #ded8d6;
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(55,43,46,.08);
      color: #3b3739;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(18px) scale(.96) rotate(-2deg);
      transition: opacity .7s ease, transform 1s cubic-bezier(.16,1,.3,1), box-shadow .8s ease;
    }
    .request-sheet::after { content: attr(data-detail); display: block; margin-top: 6px; color: #aaa2a4; font-size: 10px; font-weight: 500; }
    .request-sheet::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 15px;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--red);
      opacity: 0;
      box-shadow: 0 0 0 0 rgba(232,65,46,.22);
    }
    .request-sheet { padding-left: 34px; }
    .request-sheet:nth-child(1) { top: 3px; left: 15%; transition-delay: .2s; }
    .request-sheet:nth-child(2) { top: 48px; left: 21%; transition-delay: .72s; }
    .request-sheet:nth-child(3) { top: 92px; left: 27%; transition-delay: 1.24s; }
    .capabilities-bento.is-active .request-sheet {
      opacity: 1;
      transform: none;
      box-shadow: 0 14px 30px rgba(55,43,46,.10);
      animation: requestFloat 5.6s ease-in-out infinite;
    }
    .capabilities-bento.is-active .request-sheet::before { animation: notificationDot 2.8s ease-out infinite; }
    .capabilities-bento.is-active .request-sheet:nth-child(1) { animation-delay: .2s; }
    .capabilities-bento.is-active .request-sheet:nth-child(2) { animation-delay: .72s; }
    .capabilities-bento.is-active .request-sheet:nth-child(3) { animation-delay: 1.24s; }
    .capabilities-bento.is-active .request-sheet:nth-child(1)::before { animation-delay: .32s; }
    .capabilities-bento.is-active .request-sheet:nth-child(2)::before { animation-delay: .9s; }
    .capabilities-bento.is-active .request-sheet:nth-child(3)::before { animation-delay: 1.48s; }

    .plan-list { width: min(260px, 82%); margin: 0 auto; padding: 8px 0 0; list-style: none; counter-reset: plan; }
    .plan-list li {
      counter-increment: plan;
      position: relative;
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 0 14px 0 43px;
      border: 1px solid #e1dcda;
      border-radius: 9px;
      background: #fff;
      color: #a9a2a4;
      font-size: 11px;
      transition: transform .45s cubic-bezier(.16,1,.3,1), color .35s ease, border-color .35s ease, box-shadow .35s ease;
    }
    .plan-list li + li { margin-top: 7px; }
    .plan-list li::before {
      content: counter(plan);
      position: absolute;
      left: 12px;
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #ebe7e6;
      color: #777174;
      font-weight: 800;
    }
    .plan-list li.is-current { color: var(--ink); border-color: #f5a49e; box-shadow: 0 8px 20px rgba(239,63,53,.08); transform: translateX(4px); }
    .plan-list li.is-current::before, .plan-list li.is-done::before { background: #ff8279; color: #fff; }
    .plan-list li.is-done { color: #6c6568; }

    .scan-document {
      position: absolute;
      left: 50%;
      top: 7px;
      width: min(260px, 82%);
      min-height: 132px;
      padding: 26px 24px;
      border: 1px solid #ddd7d5;
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(55,43,46,.07);
      transform: translateX(-50%);
    }
    .scan-item { display: grid; grid-template-columns: 17px 1fr; align-items: center; gap: 9px; color: #847d80; font-size: 11px; }
    .scan-item + .scan-item { margin-top: 12px; }
    .scan-item input { width: 15px; height: 15px; margin: 0; accent-color: var(--green); pointer-events: none; }
    .scan-line {
      position: absolute;
      z-index: 2;
      left: 11%;
      right: 11%;
      top: 28px;
      height: 2px;
      border-radius: 99px;
      background: var(--red);
      box-shadow: 0 0 14px rgba(239,63,53,.45);
      opacity: 0;
    }
    .capabilities-bento.is-active .scan-line { animation: qualityScan 4.8s cubic-bezier(.4,0,.2,1) infinite; }

    .approval-panel {
      position: absolute;
      left: 50%;
      top: 8px;
      width: min(260px, 82%);
      min-height: 136px;
      padding: 22px;
      border: 1px solid #ded8d6;
      border-radius: 13px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(55,43,46,.08);
      transform: translateX(-50%);
      transition: transform .75s cubic-bezier(.16,1,.3,1), box-shadow .5s ease;
    }
    .approval-panel strong { display: block; text-align: center; font-size: 13px; }
    .approval-panel small { display: block; margin-top: 9px; color: #9d9698; text-align: center; font-size: 10px; }
    .approval-actions { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
    .approval-actions button { min-height: 32px; border: 1px solid #ddd7d5; border-radius: 8px; padding: 0 16px; background: #fff; color: var(--ink); font-size: 11px; font-weight: 700; }
    .approval-actions .approve { border-color: var(--ink); background: var(--ink); color: #fff; }
    .capabilities-bento.is-active .approval-panel { animation: approvalFloat 5.5s ease-in-out infinite; }

    @keyframes qualityScan {
      0%, 10% { top: 26px; opacity: 0; }
      18% { opacity: 1; }
      62% { top: 122px; opacity: 1; }
      70%, 100% { top: 122px; opacity: 0; }
    }
    @keyframes requestFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -4px; }
    }
    @keyframes notificationDot {
      0%, 52%, 100% { opacity: .42; box-shadow: 0 0 0 0 rgba(232,65,46,.18); }
      12% { opacity: 1; box-shadow: 0 0 0 9px rgba(232,65,46,0); }
    }
    @keyframes approvalFloat { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-5px); box-shadow: 0 17px 32px rgba(55,43,46,.12); } }

    .shift-cta { margin-top: 28px; text-align: center; }
    .shift-cta .btn { min-width: 220px; }

    /* Pricing */
    .pricing { padding: 100px 0; }
    .pricing-head { text-align: center; }
    .pricing-chip { display: inline-flex; align-items: center; gap: 13px; padding: 8px 18px; border-radius: 999px; background: linear-gradient(90deg,#ffe7e5,#cbd5ff); font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .pricing-chip img { width: 7px; height: 7px; }
    .pricing-head .section-title { margin-top: 31px; }
    .billing-toggle { width: fit-content; margin: 34px 0 32px auto; padding: 4px; border-radius: 999px; display: flex; gap: 4px; align-items: center; background: rgba(255,255,255,.46); border: 1px solid rgba(224,218,216,.72); box-shadow: inset 0 1px 0 rgba(255,255,255,.86); }
    .billing-toggle button { min-height: 44px; border: 0; border-radius: 999px; padding: 0 34px; background: transparent; cursor: pointer; transition: background .22s ease, box-shadow .22s ease, color .22s ease; }
    .billing-toggle button.active { background: #fff; box-shadow: 0 8px 24px rgba(55,43,46,.08); font-weight: 700; }
    .billing-toggle button[data-period="yearly"] { display: inline-flex; align-items: center; gap: 10px; padding-right: 12px; }
    .save-badge { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; background: rgba(0,173,125,.14); color: #168665; font-size: 10px; font-weight: 850; letter-spacing: .03em; opacity: .68; transform: scale(.94); transition: opacity .22s ease, transform .22s ease, background .22s ease, color .22s ease; }
    .billing-toggle button.active .save-badge { background: var(--green); color: #fff; opacity: 1; transform: scale(1); }
    .plans { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; overflow: visible; }
    .plan { position: relative; z-index: 0; min-height: 510px; padding: 24px 20px; border: 1px solid rgba(229,223,221,.82); border-radius: 22px; background: #fff; box-shadow: var(--shadow); overflow: visible; transition: transform .34s cubic-bezier(.2,.8,.2,1), box-shadow .34s ease, border-color .34s ease, background .34s ease; }
    .plan.featured { background: var(--ink); color: #fff; outline: 2px solid #b8c3ff; }
    .popular { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); padding: 8px 18px; border-radius: 999px; background: var(--red); color: white; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .plan h3 { margin: 0; font-size: 25px; }
    .plan .audience { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .plan.featured .audience, .plan.featured .billing { color: #b9b4b5; }
    .price { margin: 17px 0 0; font-size: 34px; font-weight: 800; letter-spacing: -.05em; }
    .old-price { float: right; margin-top: 10px; color: #8c8588; font-size: 13px; text-decoration: line-through; font-weight: 400; }
    .billing { margin: 6px 0 16px; color: var(--muted); font-size: 11px; min-height: 17px; }
    .plan .btn { width: 100%; min-height: 43px; }
    .plan.featured .btn { background: #fff; color: var(--ink); }
    .plan hr { margin: 15px 0; border: 0; border-top: 1px solid var(--line); }
    .plan.featured hr { border-color: #49494b; }
    .best-for { font-size: 10px; font-weight: 800; color: var(--muted); letter-spacing: .06em; }
    .features { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 20px; font-size: 12px; }
    .features li::before { content: "âœ“"; margin-right: 11px; color: var(--green); font-weight: 900; }
    .featured .features li::before { color: var(--red); }
    @media (hover:hover) {
      .plan:hover { z-index: 20; transform: translateY(-9px); border-color: rgba(232,65,46,.34); box-shadow: 0 26px 68px rgba(55,43,46,.14); }
      .plan:hover .btn { transform: translateY(-1px); }
      .plan.featured:hover { box-shadow: 0 28px 74px rgba(25,24,23,.28); }
    }
    .enterprise {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      padding: 44px 58px;
      border: 1px solid rgba(229,52,43,.24);
      border-radius: 18px;
      background:
        radial-gradient(circle at 14% 12%, rgba(255,116,101,.30), rgba(255,116,101,0) 36%),
        radial-gradient(circle at 84% 82%, rgba(126,142,255,.28), rgba(126,142,255,0) 38%),
        linear-gradient(120deg, #fff0eb 0%, #fffaf8 34%, #f0efff 68%, #ffdcd4 100%);
      background-size: 190% 190%;
      box-shadow: 0 24px 54px rgba(81,52,49,.15), inset 0 1px 0 rgba(255,255,255,.8);
      animation: enterpriseGlow 6.5s ease-in-out infinite alternate;
    }
    .enterprise::before {
      content: "";
      position: absolute;
      inset: -45% -18%;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 24%, rgba(255,112,98,.22) 42%, rgba(126,142,255,.24) 58%, transparent 76%);
      transform: translateX(-24%);
      animation: enterpriseSheen 6.8s ease-in-out infinite;
    }
    .enterprise > * { position: relative; z-index: 1; }
    .enterprise h3 { margin: 0; font-size: 24px; }
    .enterprise p { margin: 10px 0 0; color: var(--muted); }
    .enterprise .btn { min-width: 220px; }
    @keyframes enterpriseGlow { 0% { background-position: 0% 40%; } 100% { background-position: 100% 60%; } }
    @keyframes enterpriseSheen { 0%, 14% { transform: translateX(-36%); opacity: .45; } 60% { transform: translateX(34%); opacity: 1; } 100% { transform: translateX(34%); opacity: .45; } }

    /* FAQ */
    .faq { padding: 100px 0; }
    .faq-grid { display: grid; grid-template-columns: 280px 1fr; gap: 80px; }
    .faq .section-title { font-size: clamp(36px, 4vw, 52px); }
    .faq-list { border-top: 1px solid transparent; }
    .faq-item { border-bottom: 1px solid var(--line); }
    .faq-question { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 25px 0; border: 0; background: transparent; text-align: left; font-weight: 800; cursor: pointer; }
    .faq-icon { color: var(--red); font-size: 20px; font-weight: 400; transform: rotate(45deg); transition: transform .2s ease; }
    .faq-item.collapsed .faq-icon { transform: rotate(0); }
    .faq-answer { max-width: 760px; overflow: hidden; max-height: 180px; padding: 0 0 24px; color: var(--muted); font-size: 14px; transition: .28s ease; }
    .faq-item.collapsed .faq-answer { max-height: 0; padding-bottom: 0; opacity: 0; }
